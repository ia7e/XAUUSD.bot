# Render Configuration for XAUUSD Trading Bot
# This file is for Render.com deployment

# Service name
name: XAUUSD Trading Bot

# Type of service
service: web

# Build command
build: pip install -r requirements.txt

# Start command - Run both bot and web server
start: python run_web_server.py

# Environment variables
env:
  # Set TELEGRAM_TOKEN and TELEGRAM_CHAT_ID as private Render environment variables.
  - key: XAUUSD_SOURCE
    value: BIQUOTE
  - key: BIQUOTE_BASE_URL
    value: https://biquote.io/api
  - key: BIQUOTE_SYMBOL
    value: XAUUSD
  - key: EXCHANGE_ID
    value: binance
  - key: SYMBOL
    value: XAU/USD:XAU
  - key: CANDLES_COUNT
    value: "600"
  - key: LOG_LEVEL
    value: INFO
  - key: CHECK_INTERVAL
    value: "1"

# Region
region: us-east-1

# Instance type
instance: free

# Auto-deploy on push
autoDeploy: true

# Branch
branch: main

# Health check
healthCheckPath: /
healthCheckInterval: 300
